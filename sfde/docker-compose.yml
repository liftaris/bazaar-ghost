services:
  sfde:
    build:
      context: .
      additional_contexts:
        contracts: ../contracts
    image: sfde:dev
    env_file:
      - ../.env.dev
    environment:
      CHUNK_ID: ${CHUNK_ID:?Set CHUNK_ID to a pending local chunk UUID}
      SFDE_PROFILE: ${SFDE_PROFILE:?Set SFDE_PROFILE to the streamer's JSON profile}
      QUALITY: ${QUALITY:-480p}
      ENVIRONMENT: dev
    network_mode: host
    restart: "no"
