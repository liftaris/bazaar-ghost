name: Process VOD
run-name: Process VOD ${{ inputs.vod_id }}

on:
  workflow_dispatch:
    inputs:
      vod_id:
        description: Platform video ID
        required: true
        type: string
      source:
        description: Video platform
        type: choice
        options: [twitch, youtube, bilibili]
        default: twitch
      quality:
        description: Preferred stream quality
        default: "480p"
        type: string
      environment:
        description: Environment
        required: true
        type: choice
        options: [dev, production]
        default: dev
      sfde_profile:
        description: Optional profile JSON override (defaults to the streamer's profile)
        type: string
      local:
        description: Use a prebuilt local image and skip rendition discovery
        type: boolean
        default: false
      chunk_uuids:
        description: Optional JSON array of chunk UUIDs
        type: string
      old_templates:
        description: Use pre-August-2025 templates (480p only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VOD_ID: ${{ inputs.vod_id }}
      VIDEO_SOURCE: ${{ inputs.source || 'twitch' }}
      INPUT_CHUNKS: ${{ inputs.chunk_uuids }}
      REQUESTED_QUALITY: ${{ inputs.quality }}
      SFDE_PROFILE: ${{ inputs.sfde_profile }}
      OLD_TEMPLATES: ${{ inputs.old_templates }}
      LOCAL: ${{ inputs.local }}
    outputs:
      chunk_uuids: ${{ steps.prepare.outputs.chunk_uuids }}
      old_templates: ${{ steps.prepare.outputs.old_templates }}
      quality: ${{ steps.prepare.outputs.quality }}
      stream_quality: ${{ steps.prepare.outputs.stream_quality }}
      video_fps: ${{ steps.prepare.outputs.video_fps }}
      sfde_profile: ${{ steps.prepare.outputs.sfde_profile }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install 'streamlink==8.6.2' 'yt-dlp[default]>=2026.7.4,<2027'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: prepare
        run: python scripts/vod_workflow.py prepare
      - if: failure()
        run: python scripts/vod_workflow.py fail-queued

  process-chunk:
    needs: prepare
    if: needs.prepare.outputs.chunk_uuids != '[]'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk_id: ${{ fromJson(needs.prepare.outputs.chunk_uuids) }}
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CHUNK_ID: ${{ matrix.chunk_id }}
      QUALITY: ${{ needs.prepare.outputs.quality }}
      STREAM_QUALITY: ${{ needs.prepare.outputs.stream_quality }}
      VIDEO_FPS: ${{ needs.prepare.outputs.video_fps }}
      SFDE_PROFILE: ${{ needs.prepare.outputs.sfde_profile }}
      OLD_TEMPLATES: ${{ needs.prepare.outputs.old_templates }}
      ENVIRONMENT: ${{ inputs.environment }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${{ secrets.GRAFANA_OTLP_AUTH }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.local }}
      - uses: docker/build-push-action@v6
        if: ${{ !inputs.local }}
        timeout-minutes: 10
        with:
          context: ./sfde
          tags: sfde:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Process chunk
        run: |
          mkdir -p output
          chmod 777 output
          docker run --rm --network host \
            -v "$PWD/output:/app/output" \
            -e SUPABASE_URL -e SUPABASE_SECRET_KEY -e CHUNK_ID \
            -e QUALITY -e STREAM_QUALITY -e VIDEO_FPS -e SFDE_PROFILE -e OLD_TEMPLATES \
            -e ENVIRONMENT -e OTEL_EXPORTER_OTLP_ENDPOINT -e OTEL_EXPORTER_OTLP_HEADERS \
            sfde:dev
      - name: Fail unclaimed chunk
        if: failure()
        run: python scripts/vod_workflow.py fail-chunk
      - name: Write summary
        if: always()
        run: python scripts/vod_workflow.py summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detections-${{ matrix.chunk_id }}
          path: output/*.json
          if-no-files-found: ignore
