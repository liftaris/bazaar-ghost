name: Process VOD
run-name: Process VOD ${{ inputs.vod_id }}

on:
  workflow_dispatch:
    inputs:
      vod_id:
        description: "VOD ID to process"
        required: true
        type: string
      quality:
        description: "Preferred stream quality"
        required: false
        type: string
        default: "480p"
      environment:
        description: "Environment (dev or production)"
        required: true
        type: choice
        options:
          - dev
          - production
        default: dev
      sfot_profile:
        description: "SFOT profile configuration (JSON string)"
        required: false
        type: string
        default: ""
      local:
        description: "Apply when running this action locally"
        required: false
        type: boolean
        default: false
      chunk_uuids:
        description: "JSON array of chunk UUIDs to process (optional - will fetch from Supabase if not provided)"
        required: false
        type: string
        default: ""
      old_templates:
        description: "Use old templates (normalize processing to 480p)"
        required: false
        type: boolean
        default: false

jobs:
  # Pre-flight check: Verify VOD availability and determine best quality
  check-vod:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    outputs:
      quality: ${{ steps.check.outputs.quality }}
      available: ${{ steps.check.outputs.available }}
      video_fps: ${{ steps.check.outputs.video_fps }}
      stream_quality: ${{ steps.check.outputs.stream_quality }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install streamlink
        if: ${{ !inputs.local }}
        run: pip install streamlink==8.6.2

      - name: Check VOD availability and quality
        id: check
        env:
          VOD_ID: ${{ inputs.vod_id }}
          REQUESTED_QUALITY: ${{ inputs.quality }}
          OLD_TEMPLATES: ${{ inputs.old_templates }}
          LOCAL: ${{ inputs.local }}
        run: python scripts/prepare_twitch_rendition.py

  # Preflight failures leave existing VOD/chunk state unchanged.
  # VOD status is derived by database triggers from individual chunk statuses.

  # Fetch chunks from Supabase if not provided
  fetch-chunks:
    needs: check-vod
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    outputs:
      chunk_uuids: ${{ steps.fetch.outputs.chunk_uuids }}

    steps:
      - name: Determine chunk UUIDs
        id: fetch
        env:
          VOD_ID: ${{ inputs.vod_id }}
          INPUT_CHUNKS: ${{ inputs.chunk_uuids }}
        run: |
          [[ "$VOD_ID" =~ ^[0-9]+$ ]] || exit 1
          UUID_PATTERN='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          validate_chunks() {
            jq -ce --arg pattern "$UUID_PATTERN" '
              if type == "array" and all(.[]; type == "string" and test($pattern))
              then . else error("Expected an array of chunk UUIDs") end'
          }

          CHUNK_IDS="[]"
          if [ -n "$INPUT_CHUNKS" ]; then
            CHUNK_IDS=$(validate_chunks <<< "$INPUT_CHUNKS")
          fi

          if [ "$CHUNK_IDS" = "[]" ]; then
            echo "Fetching pending chunks for VOD $VOD_ID"
            RPC_REQUEST=$(jq -nc --arg source "$VOD_ID" '{p_source_id: $source}')
            if ! RESPONSE=$(curl -fsSL -X POST "$SUPABASE_URL/rest/v1/rpc/get_pending_chunks_for_vod" \
              -H "apikey: $SUPABASE_SECRET_KEY" \
              -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              --data "$RPC_REQUEST"); then
              echo "Failed to fetch pending chunks"
              exit 1
            fi
            CHUNK_IDS=$(jq -ce 'if type == "array" then map(.chunk_id) else error("Invalid chunk response") end' <<< "$RESPONSE" | validate_chunks)
          fi

          if [ "$CHUNK_IDS" = "[]" ]; then
            echo "No pending chunks for VOD $VOD_ID; existing state is unchanged"
            exit 1
          fi
          CHUNK_COUNT=$(jq 'length' <<< "$CHUNK_IDS")
          echo "Processing $CHUNK_COUNT explicitly selected chunks for VOD $VOD_ID"
          echo "chunk_uuids=$CHUNK_IDS" >> "$GITHUB_OUTPUT"

  # Process all chunks in parallel using matrix strategy
  process-chunk:
    needs: [check-vod, fetch-chunks]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30 # Overall job timeout
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    strategy:
      matrix:
        chunk_id: ${{ fromJson(needs.fetch-chunks.outputs.chunk_uuids) }}
      # Allow some chunks to fail without stopping others
      fail-fast: false

    steps:
      - name: Checkout repository
        if: ${{ !inputs.local }}
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ !inputs.local }}
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Build SFOT container with cache
        if: ${{ !inputs.local }}
        uses: docker/build-push-action@v5
        timeout-minutes: 10
        with:
          context: ./sfot
          tags: bazaar-ghost-sfot
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Process chunk with SFOT
        id: sfot
        timeout-minutes: 25
        env:
          QUALITY: ${{ needs.check-vod.outputs.quality }}
          STREAM_QUALITY: ${{ needs.check-vod.outputs.stream_quality }}
          VIDEO_FPS: ${{ needs.check-vod.outputs.video_fps }}
          SFOT_PROFILE: ${{ inputs.sfot_profile }}
        run: |
          # Create output directory with write permissions for container user (UID 1000)
          mkdir -p ./output
          chmod 777 ./output

          echo "Using processing quality: $QUALITY"
          echo "Using exact source rendition: $STREAM_QUALITY"
          echo "Source FPS: ${VIDEO_FPS:-unknown}"

          echo "Processing chunk ${{ matrix.chunk_id }} for VOD ${{ inputs.vod_id }}"
          echo "Small templates mode: ${{ inputs.old_templates }}"
          echo "Environment: ${{ inputs.environment }}"

          # Parse SFOT profile if provided
          if [ -n "$SFOT_PROFILE" ] && [ "$SFOT_PROFILE" != "" ]; then
            echo "Using SFOT profile"
            echo "$SFOT_PROFILE" | jq '.'
          else
            echo "No SFOT profile provided, SFOT will use defaults"
          fi

          # Run SFOT container - it will handle all chunk details and status updates internally
          docker run --rm \
            --network="host" \
            -v "./output:/app/output" \
            -e SUPABASE_URL="$SUPABASE_URL" \
            -e SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY" \
            -e CHUNK_ID="${{ matrix.chunk_id }}" \
            -e TEST_MODE="false" \
            -e QUALITY="$QUALITY" \
            -e STREAM_QUALITY="$STREAM_QUALITY" \
            -e VIDEO_FPS="$VIDEO_FPS" \
            -e OLD_TEMPLATES="${{ inputs.old_templates }}" \
            -e SFOT_PROFILE="$SFOT_PROFILE" \
            -e ENVIRONMENT="${{ inputs.environment }}" \
            -e OTEL_EXPORTER_OTLP_ENDPOINT="${{ secrets.GRAFANA_OTLP_ENDPOINT }}" \
            -e OTEL_EXPORTER_OTLP_HEADERS="Authorization=Basic ${{ secrets.GRAFANA_OTLP_AUTH }}" \
            -e OTEL_SERVICE_NAME="sfot" \
            -e OTEL_RESOURCE_ATTRIBUTES="deployment.environment=${{ inputs.environment }},vod.id=${{ inputs.vod_id }},chunk.id=${{ matrix.chunk_id }}" \
            bazaar-ghost-sfot

          DOCKER_EXIT_CODE=$?
          echo "Docker run exit code: $DOCKER_EXIT_CODE"

          if [ $DOCKER_EXIT_CODE -eq 0 ]; then
            echo "Chunk ${{ matrix.chunk_id }} completed successfully"
          else
            echo "Chunk ${{ matrix.chunk_id }} failed with exit code: $DOCKER_EXIT_CODE"
            exit $DOCKER_EXIT_CODE
          fi

      - name: Generate workflow summary
        if: success()
        run: |
          # Check if detection summary file exists for this chunk
          SUMMARY_FILE="./output/detections_${{ matrix.chunk_id }}.json"

          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "No detection summary found for chunk ${{ matrix.chunk_id }}"
            echo "## Chunk ${{ matrix.chunk_id }}" >> $GITHUB_STEP_SUMMARY
            echo "No detections found in this chunk." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Parse detection summary
          SUMMARY=$(cat "$SUMMARY_FILE")
          CHUNK_ID=$(echo "$SUMMARY" | jq -r '.chunk_id')
          VOD_ID=$(echo "$SUMMARY" | jq -r '.vod_id')
          STREAMER=$(echo "$SUMMARY" | jq -r '.streamer')
          QUALITY=$(echo "$SUMMARY" | jq -r '.quality')
          FRAMES=$(echo "$SUMMARY" | jq -r '.frames_processed')
          MATCHUPS=$(echo "$SUMMARY" | jq -r '.matchups_found')
          START_TIME=$(echo "$SUMMARY" | jq -r '.start_time')
          END_TIME=$(echo "$SUMMARY" | jq -r '.end_time')

          # Calculate duration
          DURATION=$((END_TIME - START_TIME))

          # Format timestamp for readability
          START_HMS=$(date -u -d "@${START_TIME}" +%H:%M:%S 2>/dev/null || echo "${START_TIME}s")
          END_HMS=$(date -u -d "@${END_TIME}" +%H:%M:%S 2>/dev/null || echo "${END_TIME}s")

          # Generate markdown summary
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Chunk ${{ matrix.chunk_id }} Results

          **VOD:** [${VOD_ID}](https://www.twitch.tv/videos/${VOD_ID}) (${STREAMER})
          **Time Range:** ${START_HMS} - ${END_HMS} (${DURATION}s)
          **Quality:** ${QUALITY}
          **Frames Processed:** ${FRAMES}
          **Matchups Detected:** ${MATCHUPS}

          ### All Detected Usernames

          | Timestamp | Username | Confidence | Rank | Image |
          |-----------|----------|------------|------|-------|
          EOF

          # Get source_id for image URLs
          SOURCE_ID=$(echo "$SUMMARY" | jq -r '.vod_id')

          # Add each detection as a table row with link to image in Supabase storage
          echo "$SUMMARY" | jq -r --arg sid "$SOURCE_ID" --arg base_url "$SUPABASE_URL" '.detections[] | "| \(.timestamp)s | \(.username) | \(.confidence * 100 | floor)% | \(.rank) | [view](\($base_url)/storage/v1/object/public/detections/\($sid)/\(.timestamp).jpg) |"' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
