name: Process VOD
run-name: Process VOD ${{ inputs.vod_id }} (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      vod_id:
        description: Platform video ID
        required: true
        type: string
      source:
        description: Video platform
        type: choice
        options: [twitch, youtube, bilibili]
        default: twitch
      quality:
        description: Preferred stream quality
        default: "480p"
        type: string
      environment:
        description: Environment
        required: true
        type: choice
        options: [validation, dev, production]
        default: validation
      sfde_profile:
        description: Legacy saved profile snapshot; ignored by SFDE NEXT
        type: string
      local:
        description: Use a prebuilt local image and skip rendition discovery
        type: boolean
        default: false
      chunk_uuids:
        description: Optional JSON array of chunk UUIDs
        type: string
      queued_at:
        description: Dispatch timestamp supplied by the backend (leave blank for manual runs)
        type: string
      old_templates:
        description: Require old templates (480p only); must match the catalog template era
        type: boolean
        default: false
      sfde_next:
        description: Use the evidence-based SFDE processor (validation only)
        type: boolean
        default: false
      runtime_image:
        description: Tested runtime OCI digest supplied by the validation backend
        type: string
      processor_revision:
        description: Commit paired with the tested runtime
        type: string

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    if: >-
      (inputs.environment == 'validation' && github.ref == 'refs/heads/migration/cloudflare') ||
      (inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
      (inputs.environment == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    env:
      QUEUED_AT: ${{ inputs.queued_at }}
      BAZAARGHOST_API_URL: ${{ vars.BAZAARGHOST_API_URL }}
      BAZAARGHOST_PROCESSOR_KEY: ${{ secrets.BAZAARGHOST_PROCESSOR_KEY }}
      VOD_ID: ${{ inputs.vod_id }}
      VIDEO_SOURCE: ${{ inputs.source || 'twitch' }}
      ENVIRONMENT: ${{ inputs.environment }}
      INPUT_CHUNKS: ${{ inputs.chunk_uuids }}
      REQUESTED_QUALITY: ${{ inputs.quality }}
      SFDE_PROFILE: ${{ inputs.sfde_profile }}
      SFDE_NEXT_ENABLED: ${{ inputs.sfde_next && 'true' || 'false' }}
      OLD_TEMPLATES: ${{ inputs.old_templates }}
      LOCAL: ${{ inputs.local }}
      SFDE_RUNTIME_IMAGE: ${{ inputs.runtime_image }}
      BUILD_COMMIT: ${{ inputs.processor_revision }}
    outputs:
      chunk_uuids: ${{ steps.prepare.outputs.chunk_uuids }}
      old_templates: ${{ steps.prepare.outputs.old_templates }}
      quality: ${{ steps.prepare.outputs.quality }}
      stream_quality: ${{ steps.prepare.outputs.stream_quality }}
      sfde_profile: ${{ steps.prepare.outputs.sfde_profile }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.processor_revision || github.sha }}
      - name: Validate runtime identity
        if: inputs.runtime_image != '' || inputs.processor_revision != ''
        run: python scripts/runtime_image.py validate
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-workflow.txt
      - name: Check SFDE target
        if: inputs.sfde_next && inputs.environment != 'validation'
        run: |
          echo "The evidence-based processor is enabled only for validation."
          exit 1
      - name: Verify backend environment
        run: python scripts/backend_environment.py
      - uses: denoland/setup-deno@v2.0.5
        if: inputs.source == 'youtube' && !inputs.local
        with:
          deno-version: v2.9.7
      - name: Install media resolver
        if: ${{ !inputs.local }}
        run: pip install -r scripts/requirements-workflow.txt
      - name: Install YouTube fallback
        if: inputs.source == 'youtube' && !inputs.local
        run: pip install 'yt-dlp[default]==2026.8.19'
      - id: prepare
        run: python scripts/vod_workflow.py prepare
      - if: failure() || cancelled()
        run: python scripts/vod_workflow.py fail-queued

  process-chunk:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.chunk_uuids != '[]'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        chunk_id: ${{ fromJson(needs.prepare.outputs.chunk_uuids) }}
    env:
      QUEUED_AT: ${{ inputs.queued_at }}
      BAZAARGHOST_API_URL: ${{ vars.BAZAARGHOST_API_URL }}
      BAZAARGHOST_PROCESSOR_KEY: ${{ secrets.BAZAARGHOST_PROCESSOR_KEY }}
      CHUNK_ID: ${{ matrix.chunk_id }}
      QUALITY: ${{ needs.prepare.outputs.quality }}
      STREAM_QUALITY: ${{ needs.prepare.outputs.stream_quality }}
      SFDE_PROFILE: ${{ needs.prepare.outputs.sfde_profile }}
      OLD_TEMPLATES: ${{ needs.prepare.outputs.old_templates }}
      ENVIRONMENT: ${{ inputs.environment }}
      SFDE_NEXT_ENABLED: ${{ inputs.sfde_next && 'true' || 'false' }}
      SFDE_RUNTIME_IMAGE: ${{ inputs.runtime_image }}
      SFDE_IMAGE: ${{ inputs.runtime_image || 'sfde:dev' }}
      BUILD_COMMIT: ${{ inputs.processor_revision }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.environment != 'validation' && secrets.GRAFANA_OTLP_ENDPOINT || '' }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.environment != 'validation' && format('Authorization=Basic {0}', secrets.GRAFANA_OTLP_AUTH) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.processor_revision || github.sha }}
      - name: Verify backend environment
        run: python scripts/backend_environment.py
      - uses: docker/setup-buildx-action@v4.4.1
        if: ${{ !inputs.local && inputs.runtime_image == '' }}
      - uses: docker/build-push-action@v7.4.0
        if: ${{ !inputs.local && inputs.runtime_image == '' }}
        timeout-minutes: 10
        with:
          context: ./sfde
          build-contexts: contracts=./contracts
          tags: sfde:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pull tested runtime
        id: pull
        if: inputs.runtime_image != ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/runtime_image.py validate
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          SECONDS=0
          docker pull "$SFDE_IMAGE"
          python scripts/runtime_image.py verify
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
      - name: Process chunk
        timeout-minutes: 35
        run: |
          mkdir -p output
          chmod 777 output
          docker run --rm --network host \
            -v "$PWD/output:/app/output" \
            -e BAZAARGHOST_API_URL -e BAZAARGHOST_PROCESSOR_KEY -e CHUNK_ID -e QUEUED_AT \
            -e QUALITY -e STREAM_QUALITY -e SFDE_PROFILE -e OLD_TEMPLATES \
            -e ENVIRONMENT -e SFDE_NEXT_ENABLED \
            -e OTEL_EXPORTER_OTLP_ENDPOINT -e OTEL_EXPORTER_OTLP_HEADERS \
            "$SFDE_IMAGE"
      - name: Fail unclaimed chunk
        if: failure() || cancelled()
        run: python scripts/vod_workflow.py fail-chunk
      - name: Write summary
        if: always()
        env:
          IMAGE_PULL_SECONDS: ${{ steps.pull.outputs.seconds }}
        run: python scripts/vod_workflow.py summary
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: detections-${{ matrix.chunk_id }}
          path: output/*.json
          if-no-files-found: ignore
