name: Cloudflare Validation
on:
  push:
    branches: [migration/cloudflare]
    paths: ["sfde/**", "worker/**", "contracts/**", "package*.json", "cloudflare.config.ts", "wrangler.config.ts", "config/**", "vitest.config.ts", "tsconfig.json", "scripts/**", ".github/workflows/**"]
  pull_request:
    branches: [migration/cloudflare]
    paths: ["sfde/**", "worker/**", "contracts/**", "package*.json", "cloudflare.config.ts", "wrangler.config.ts", "config/**", "vitest.config.ts", "tsconfig.json", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/test-sfde.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/migration/cloudflare' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: validation
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
      BUILD_COMMIT: ${{ github.sha }}
      # Separate names prevent fallback to any existing repo/dev/production credentials.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_VALIDATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_VALIDATION_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: credentials
        name: Check validation deployment credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Validation tests passed; deployment skipped because validation credentials are not configured."
            echo "Deployment skipped. Set CLOUDFLARE_VALIDATION_API_TOKEN and CLOUDFLARE_VALIDATION_ACCOUNT_ID in the validation environment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7.1.0
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: "24"
          cache: npm
      - if: steps.credentials.outputs.available == 'true'
        run: npm ci --ignore-scripts
      - name: Verify branch and resource isolation
        if: steps.credentials.outputs.available == 'true'
        run: python scripts/deployment_check.py validation --ref "$GITHUB_REF"
      - name: Validate the deployment bundle
        if: steps.credentials.outputs.available == 'true'
        run: |
          npx cf build --mode validation
          npx cf deploy --prebuilt --mode validation --dry-run
      - name: Apply validation database migrations
        if: steps.credentials.outputs.available == 'true'
        run: python scripts/database.py migrate --environment validation
      - name: Deploy validation Worker
        if: steps.credentials.outputs.available == 'true'
        run: npx cf deploy --prebuilt --mode validation
      - name: Verify deployed environment
        if: steps.credentials.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.request import Request
          sys.path.insert(0, 'scripts')
          from backend_environment import open_backend
          from deployment_check import validate
          config = validate('validation')
          url = config['vars']['PUBLIC_URL'].rstrip('/') + '/health'
          for attempt in range(6):
              try:
                  with open_backend(Request(url), timeout=15) as response:
                      result = json.load(response)
                  if result.get('ok') is not True or result.get('environment') != 'validation':
                      raise ValueError('The deployed endpoint is not the validation environment')
                  if result.get('build_commit') != os.environ['GITHUB_SHA']:
                      raise ValueError('The deployed endpoint is not running the tested commit')
                  print('Validation Worker health verified:', url)
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(5)
          PY
