name: Sync Discord Commands
run-name: Sync Discord Commands

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "worker/discord/commands.json"
  workflow_dispatch:

jobs:
  sync:
    # A manual run from a migration branch must never update global commands.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Sync commands to Discord
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # Dev branch: guild-only commands (instant update)
            URL="https://discord.com/api/v10/applications/${{ vars.DISCORD_APP_ID }}/guilds/1283636609907949600/commands"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Main branch: global commands (up to 1 hour to propagate)
            URL="https://discord.com/api/v10/applications/${{ vars.DISCORD_APP_ID }}/commands"
          else
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -d @worker/discord/commands.json \
            "$URL"
