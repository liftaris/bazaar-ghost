name: Deploy Cloudflare Backend
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, production]
        default: dev
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-backend-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    # Existing dev/production cutover remains gated. Validation has its own workflow.
    if: >-
      vars.CLOUDFLARE_BACKEND_ENABLED == 'true' &&
      ((inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
      (inputs.environment == 'production' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_SEND_TELEMETRY: "false"
      BUILD_COMMIT: ${{ github.sha }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cp .dev.vars.example .dev.vars
      - run: npm run typecheck && npm test
      - run: python scripts/deployment_check.py "$TARGET_ENV" --ref "$GITHUB_REF"
      - run: npx cf build --mode "$TARGET_ENV"
      - run: npx cf deploy --prebuilt --mode "$TARGET_ENV" --dry-run
      - run: python scripts/database.py migrate --environment "$TARGET_ENV"
      - run: npx cf deploy --prebuilt --mode "$TARGET_ENV"
