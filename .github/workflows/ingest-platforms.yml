name: Ingest platforms
on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: validation
      dispatch_ticket:
        type: string
        default: ''
      source:
        type: string
        default: none
      identity:
        type: string
        default: ''
      discovery:
        type: boolean
        default: false
      dispatch:
        type: boolean
        default: true
      limit:
        type: number
        default: 30
      seconds:
        type: number
        default: 1200
  workflow_dispatch:
    inputs:
      environment:
        description: Backend environment paired with this branch
        type: choice
        options: [validation, dev, production]
        default: validation
      dispatch_ticket:
        description: Backend dispatch identifier (leave empty for manual runs)
        type: string
      source:
        description: Optional account enrollment platform
        type: choice
        options: [none, youtube, bilibili]
        default: none
      identity:
        description: Optional YouTube UC ID/@handle/URL or Bilibili uploader UID
        type: string
      discovery:
        description: Include automatic discovery of new Bazaar creators
        type: boolean
        default: false
      dispatch:
        description: Dispatch OCR for up to three due videos after ingestion
        type: boolean
        default: true
      limit:
        description: Maximum ingestion jobs to claim (1–100)
        type: number
        default: 30
      seconds:
        description: Time budget for starting ingestion jobs (30–1200 seconds)
        type: number
        default: 1200
permissions:
  contents: read
concurrency:
  group: platform-ingestion-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  ingest:
    if: >-
      (inputs.environment == 'validation' && github.ref == 'refs/heads/migration/cloudflare') ||
      (inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
      (inputs.environment == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 35
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      INGEST_DISPATCH_TICKET: ${{ inputs.dispatch_ticket }}
      BAZAARGHOST_API_URL: ${{ vars.BAZAARGHOST_API_URL }}
      BAZAARGHOST_CATALOG_KEY: ${{ secrets.BAZAARGHOST_CATALOG_KEY }}
      SOURCE: ${{ inputs.source || 'none' }}
      IDENTITY: ${{ inputs.identity }}
      DISCOVERY: ${{ inputs.discovery }}
      INGEST_DISPATCH: ${{ inputs.dispatch }}
      INGEST_LIMIT: ${{ inputs.limit }}
      INGEST_SECONDS: ${{ inputs.seconds }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Verify backend environment
        run: python scripts/backend_environment.py
      - name: Start ingestion runner
        id: runner
        run: python scripts/catalog_api.py runner-start
      - uses: denoland/setup-deno@v2.0.5
        if: steps.runner.outputs.proceed == 'true'
        with:
          deno-version: v2.9.7
      - run: pip install 'yt-dlp[default]==2026.8.19'
        if: steps.runner.outputs.proceed == 'true'
      - name: Enroll optional account
        if: steps.runner.outputs.proceed == 'true' && steps.runner.outputs.automatic == 'false' && inputs.identity != '' && inputs.source != 'none'
        run: python scripts/platform_ingestion.py enroll --source "$SOURCE" --identity "$IDENTITY"
      - name: Run bounded platform ingestion
        if: steps.runner.outputs.proceed == 'true'
        shell: bash
        run: |
          args=(run --limit "$INGEST_LIMIT" --seconds "$INGEST_SECONDS")
          if [ "$INGEST_DISPATCH" = true ]; then args+=(--dispatch); fi
          if [ -n "$INGEST_DISPATCH_TICKET" ]; then
            args+=(--existing-work)
          elif [ "$DISCOVERY" != true ]; then
            args+=(--no-discovery)
          fi
          set -o pipefail
          python scripts/platform_ingestion.py "${args[@]}" | tee ingestion-result.jsonl
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: platform-ingestion
          path: ingestion-result.jsonl
          if-no-files-found: ignore
      - name: Finish automatic ingestion runner
        if: always() && steps.runner.outputs.proceed == 'true' && steps.runner.outputs.automatic == 'true'
        env:
          INGEST_OUTCOME: ${{ job.status }}
        run: python scripts/catalog_api.py runner-finish
