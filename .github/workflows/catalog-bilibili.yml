name: Catalog Bilibili
run-name: Catalog Bilibili submission
on:
  workflow_dispatch:
    inputs:
      video:
        description: BV ID or HTTPS video URL; add ?p=N to select a part
        required: true
        type: string
      start_part:
        description: First part position for a resumable submission backlog
        type: number
        default: 1
      limit:
        description: Maximum parts to catalog (1-50)
        type: number
        default: 10
      templates:
        type: choice
        options: [auto, old, current]
        default: auto
      ranges:
        description: Optional verified source-second ranges as JSON
        type: string
      enable_processing:
        description: Enable this Bilibili uploader for SFDE
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bilibili-catalog-validation
  cancel-in-progress: false
jobs:
  catalog:
    if: github.ref == 'refs/heads/migration/cloudflare'
    runs-on: ubuntu-latest
    environment: validation
    timeout-minutes: 15
    env:
      ENVIRONMENT: validation
      BAZAARGHOST_API_URL: ${{ vars.BAZAARGHOST_API_URL }}
      BAZAARGHOST_CATALOG_KEY: ${{ secrets.BAZAARGHOST_CATALOG_KEY }}
      VIDEO: ${{ inputs.video }}
      START_PART: ${{ inputs.start_part }}
      LIMIT: ${{ inputs.limit }}
      TEMPLATES: ${{ inputs.templates }}
      RANGES: ${{ inputs.ranges }}
      ENABLE_PROCESSING: ${{ inputs.enable_processing }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify backend environment
        run: python scripts/backend_environment.py
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Catalog a bounded set of parts
        shell: bash
        run: |
          args=(--video "$VIDEO" --start-part "$START_PART" --limit "$LIMIT" --templates "$TEMPLATES")
          if [ -n "$RANGES" ]; then args+=(--ranges "$RANGES"); fi
          if [ "$ENABLE_PROCESSING" = true ]; then args+=(--enable-processing); fi
          python scripts/catalog_bilibili.py "${args[@]}" > catalog-result.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bilibili-catalog
          path: catalog-result.json
