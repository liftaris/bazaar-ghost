name: Check YouTube runner access
on:
  # Register this branch-only workflow; pushes never execute the probe.
  push:
    branches: [migration/cloudflare, docs/youtube-support-status]
    paths: [.github/workflows/check-youtube-access.yml]
  workflow_dispatch:
    inputs:
      video_id:
        description: Public recording ID to check without cataloging or processing
        required: true
        type: string
      probe:
        description: Existing pipeline or a comparison with yt-dlp PO-token support
        type: choice
        default: baseline
        options: [baseline, po_token]
      authenticated:
        description: Use the temporary YouTube-only cookie secret
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/migration/cloudflare' || github.ref == 'refs/heads/docs/youtube-support-status')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ inputs.probe == 'po_token' && fromJSON('["bgutil","wpc"]') || fromJSON('["bgutil"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.7
      - run: pip install 'streamlink==8.6.2' 'yt-dlp[default]==2026.8.19'
      - name: Install and verify media decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Check baseline metadata and playback before installing the plugin
        continue-on-error: ${{ inputs.probe == 'po_token' }}
        env:
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          mkdir -p .ignore/youtube-pot
          python scripts/check_youtube_access.py | tee .ignore/youtube-pot/baseline.json
      - name: Install and start the pinned PO-token provider
        if: inputs.probe == 'po_token' && matrix.provider == 'bgutil'
        run: |
          pip install 'bgutil-ytdlp-pot-provider==2.0.2'
          docker run --name youtube-pot-provider -d --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4416/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install browser token provider
        if: inputs.probe == 'po_token' && matrix.provider == 'wpc'
        run: |
          pip install 'yt-dlp-getpot-wpc==1.1.2'
          google-chrome --version
          command -v xvfb-run
      - name: Install current extractor for the experiment
        if: inputs.probe == 'po_token'
        run: pip install 'yt-dlp[default]==2026.10.26' 'yt-dlp-ejs==0.8.0'
      - name: Prepare temporary YouTube session
        if: inputs.probe == 'po_token' && inputs.authenticated
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_PROBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          umask 077
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
          echo "YOUTUBE_COOKIE_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
      - name: Compare baseline and token-assisted media playback
        if: inputs.probe == 'po_token'
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          YOUTUBE_PROBE_OUTPUT: .ignore/youtube-pot
          YOUTUBE_POT_PROVIDER: ${{ matrix.provider }}
        run: xvfb-run -a python scripts/check_youtube_pot.py
      - name: Save safe reports and decoded frames
        if: always() && inputs.probe == 'po_token'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: youtube-pot-${{ inputs.video_id }}-${{ matrix.provider }}
          path: .ignore/youtube-pot/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Remove temporary YouTube session
        if: always() && inputs.authenticated
        run: rm -f "$RUNNER_TEMP/youtube-cookies.txt"
      - name: Stop token provider
        if: always() && inputs.probe == 'po_token' && matrix.provider == 'bgutil'
        run: docker rm -f youtube-pot-provider
