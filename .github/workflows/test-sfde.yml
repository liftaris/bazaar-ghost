name: Tests
on:
  push:
    branches: [main, dev]
    paths: ["sfde/**", "contracts/**", "worker/**", "package*.json", "cloudflare.config.ts", "wrangler.config.ts", "config/**", "vitest.config.ts", "tsconfig.json", "scripts/**", ".github/workflows/**"]
  pull_request:
    branches: [main, dev]
    paths: ["sfde/**", "contracts/**", "worker/**", "package*.json", "cloudflare.config.ts", "wrangler.config.ts", "config/**", "vitest.config.ts", "tsconfig.json", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
  workflow_call:
    outputs:
      runtime_image:
        description: Tested validation runtime pinned by OCI digest
        value: ${{ jobs.sfde.outputs.runtime_image }}
permissions:
  contents: read
jobs:
  sfde:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_image: ${{ steps.image.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./sfde
          build-contexts: contracts=./contracts
          target: test
          tags: sfde:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run offline tests
        run: |
          docker create --name sfde-tests --network none sfde:test
          docker start -a sfde-tests
          test "$(docker inspect -f '{{.State.ExitCode}}' sfde-tests)" -eq 0
      - name: Sign in to runtime registry
        if: github.ref == 'refs/heads/migration/cloudflare' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested runtime
        id: runtime
        if: github.ref == 'refs/heads/migration/cloudflare' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./sfde
          build-contexts: contracts=./contracts
          target: production
          tags: ghcr.io/liftaris/bazaar-ghost/sfde-next:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/liftaris/bazaar-ghost
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          cache-from: type=gha
      - name: Export pinned runtime
        id: image
        if: steps.runtime.outputs.digest != ''
        env:
          DIGEST: ${{ steps.runtime.outputs.digest }}
        run: echo "runtime_image=ghcr.io/liftaris/bazaar-ghost/sfde-next@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Collect report
        if: always()
        run: |
          docker cp sfde-tests:/app/tests/last_run_summary.md . || true
          docker cp sfde-tests:/app/tests/last_run.txt . || true
          if [ -f last_run_summary.md ]; then cat last_run_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          docker rm -f sfde-tests || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: sfde-test-report
          path: |
            last_run.txt
            last_run_summary.md
          if-no-files-found: ignore
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cp .dev.vars.example .dev.vars
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s scripts/tests
      - name: Verify cf local D1 imports
        run: RUN_LOCAL_D1_MIGRATION_TESTS=1 python -m unittest scripts.tests.test_migration_d1
