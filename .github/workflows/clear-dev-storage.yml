name: Clear Dev Storage
on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clear-dev-storage
  cancel-in-progress: false
jobs:
  clear:
    # Keep the schedule on GitHub. Explicit activation follows the eventual cutover.
    if: vars.CLOUDFLARE_BACKEND_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    env:
      ENVIRONMENT: dev
      BAZAARGHOST_API_URL: ${{ vars.BAZAARGHOST_API_URL }}
      BAZAARGHOST_ADMIN_KEY: ${{ secrets.BAZAARGHOST_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python scripts/clear_dev_storage.py
